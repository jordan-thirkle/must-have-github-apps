name: Deploy to Vercel

on:
  push:
    branches: [main]
  schedule:
    - cron: '37 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    timeout-minutes: 10
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate content
        run: npm run validate
      - name: Build site
        run: npm run build
      - name: Check Vercel deployment credentials
        id: vercel-config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Vercel Git integration is active, but GitHub Action deployment secrets are not configured. Skipping CLI deployment.'
          fi
      - name: Deploy with Vercel
        if: steps.vercel-config.outputs.configured == 'true'
        uses: amondnet/vercel-action@v42 # v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
      - name: Confirm Vercel Git deployment fallback
        if: steps.vercel-config.outputs.configured != 'true'
        run: echo 'Production deployment is handled by Vercel Git integration.'
