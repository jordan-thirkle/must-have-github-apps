name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate content
        run: npm run validate
      - name: Run tests
        run: npm test
      - name: Typecheck Astro
        run: npm run check
      - name: Check formatting
        run: npm run format:check
      - name: Build site
        run: npm run build

  markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7 # v4
        with:
          persist-credentials: false
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20 # v20
        with:
          globs: '**/*.md'
